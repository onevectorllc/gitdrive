<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drive browser</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:#1D1D1F}
a{color:#0A64D8}a:hover{color:#084FAA}
</style>
</helmet>
<div style="width: 1200px; height: 760px; box-sizing: border-box; padding: 24px; background: #E6E6EB">
<div style="height: 100%; display: flex; background: #FFFFFF; border: 1px solid #D1D1D6; border-radius: 12px; overflow: hidden">
<nav aria-label="Drives" style="width: 220px; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; padding: 14px 10px; background: #F2F2F5; border-right: 1px solid #E2E2E6">
<div style="display: flex; gap: 8px; padding: 0 4px 14px">
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span>
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span>
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span>
</div>
<span style="padding: 4px 8px; font-size: 11px; font-weight: 600; color: #5E5E66">DRIVES</span>
<a href="#" style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; background: #DCDCE2; color: #1D1D1F; font-size: 13px; font-weight: 600; text-decoration: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A64D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Team Drive</a>
<a href="#" style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: #1D1D1F; font-size: 13px; text-decoration: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E5E66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Marketing</a>
<a href="#" style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: #0A64D8; font-size: 13px; text-decoration: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A64D8" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add a drive</a>
<span style="padding: 14px 8px 4px; font-size: 11px; font-weight: 600; color: #5E5E66">TEAM DRIVE</span>
<a href="Trash.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: #1D1D1F; font-size: 13px; text-decoration: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E5E66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>Trash</a>
<div style="flex-grow: 1"></div>
<div style="display: flex; align-items: center; gap: 8px; padding: 8px; border-top: 1px solid #E2E2E6">
<span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; background: #0A64D8; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">H</span>
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">Hai</span><span style="font-size: 11px; color: #5E5E66">onevectorllc · Admin</span></div>
</div>
</nav>
<main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<div style="height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: #F6F6F8; border-bottom: 1px solid #E2E2E6">
<button aria-label="Back" style="width: 32px; height: 32px; border: none; border-radius: 6px; background: transparent"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
<span style="font-size: 15px; font-weight: 600">Team Drive</span>
<span style="font-size: 15px; color: #5E5E66">›</span>
<span style="font-size: 15px; font-weight: 600">Projects</span>
<div style="flex-grow: 1"></div>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: #E6F4EA; color: #1F7A3A; font-size: 12px; font-weight: 600"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1F7A3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>Up to date</span>
<button style="height: 32px; padding: 0 12px; border: 1px solid #D1D1D6; border-radius: 6px; background: #FFFFFF; font-size: 13px; color: #1D1D1F">Add files</button>
<button style="height: 32px; padding: 0 12px; border: 1px solid #D1D1D6; border-radius: 6px; background: #FFFFFF; font-size: 13px; color: #1D1D1F">New folder</button>
<button style="height: 32px; padding: 0 12px; border: 1px solid #D1D1D6; border-radius: 6px; background: #FFFFFF; font-size: 13px; color: #1D1D1F">Remove</button>
<a href="History.dc.html" style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 1px solid #D1D1D6; border-radius: 6px; background: #FFFFFF; font-size: 13px; color: #1D1D1F; text-decoration: none">History</a>
</div>
<div role="table" aria-label="Files" style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden">
<div role="row" style="display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 0.7fr); gap: 12px; padding: 8px 20px; border-bottom: 1px solid #E2E2E6; font-size: 12px; font-weight: 600; color: #5E5E66">
<span role="columnheader">Name</span><span role="columnheader">Modified</span><span role="columnheader">Modified by</span><span role="columnheader">Size</span>
</div>
<sc-for list="{{rows}}" as="row" hint-placeholder-count="7">
<div role="row" style="{{row.rowStyle}}">
<span role="cell" style="display: flex; align-items: center; gap: 10px; min-width: 0">
<sc-if value="{{row.folder}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#8AB4F0" stroke="#0A64D8" stroke-width="1.5" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></sc-if>
<sc-if value="{{row.file}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5E66" stroke-width="1.5" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"></path><path d="M14 3v4h4"></path></svg></sc-if>
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{row.name}}</span>
<sc-if value="{{row.syncing}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 600; color: #0A64D8; background: #E3EEFC; padding: 2px 6px; border-radius: 4px">Syncing</span></sc-if>
</span>
<span role="cell" style="color: #5E5E66">{{row.modified}}</span>
<span role="cell" style="color: #5E5E66">{{row.by}}</span>
<span role="cell" style="color: #5E5E66">{{row.size}}</span>
</div>
</sc-for>
</div>
<div style="height: 28px; display: flex; align-items: center; padding: 0 20px; border-top: 1px solid #E2E2E6; font-size: 12px; color: #5E5E66">7 items · Last synced 1 minute ago</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
renderVals() {
const base = 'display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 0.7fr); gap: 12px; align-items: center; padding: 9px 20px; border-bottom: 1px solid #F0F0F3; font-size: 13px;';
const rows = [
{ name: 'Contracts', folder: true, modified: 'Oct 24, 2026, 4:10 PM', by: 'Alex', size: '--' },
{ name: 'Photos 2026', folder: true, modified: 'Oct 25, 2026, 9:02 AM', by: 'Sam', size: '--' },
{ name: 'Budget 2027.xlsx', modified: 'Today, 10:41 AM', by: 'Hai', size: '84 KB', selected: true },
{ name: 'Client proposal.docx', modified: 'Today, 9:15 AM', by: 'Alex', size: '212 KB' },
{ name: 'Office floor plan.pdf', modified: 'Oct 20, 2026, 2:30 PM', by: 'Sam', size: '1.8 MB' },
{ name: 'Team offsite.jpg', modified: 'Just now', by: 'Hai', size: '4.2 MB', syncing: true },
{ name: 'Meeting notes.docx', modified: 'Yesterday, 5:48 PM', by: 'Hai', size: '36 KB' }
].map((r) => ({ ...r, file: !r.folder, rowStyle: base + (r.selected ? ' background: #E3EEFC;' : '') }));
return { rows };
}
}
</script>
</body>
</html>
